name: Build and Release Windows Executable
on:
  push:
    tags:
      - 'v*' # Triggers the workflow on version tags like v1.0.0, v2.1.0, etc.
  workflow_dispatch:
jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # Crucial permission required to create a release and upload assets
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Matches a stable production environment for PyInstaller
          cache: 'pip' # Caches pip dependencies to speed up future builds
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --paths=. --name="VehicleDashboard" app/main.py
        # --onefile: Bundles everything into a single executable
        # --windowed: Prevents a blank console window from popping up (ideal for GUI apps)
        # --paths=app: Helps PyInstaller resolve your local imports (controllers, models, views)
      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VehicleDashboard.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
